[project]
name = "pyinfra-webserver"
version = "0.1.0"
description = "Web server with pyinfra"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyinfra==3.8.0"]

[dependency-groups]
dev = [
  { include-group = "lint" },
]
lint = [
  "mypy[faster-cache]==2.1.0",
]

[tool.bandit]
exclude_dirs = [
  ".git",           # common env
  ".idea",          # common env
  ".venv",          # common env
  ".vscode",        # common env
  ".zed",           # common env
  ".mypy_cache",    # tools
  ".pytest_cache",  # tools
  ".ruff_cache",    # tools
  "dist",           # dist
  "docs",           # docs
  "__pycache__",    # cache
]

[tool.bandit.assert_used]
skips = ["*/*_test.py", "*/test_*.py", "./tests/conftest.py"]

[tool.flake8]
max-line-length = 120
exclude = [
  ".git",                                # common env
  ".idea",                               # common env
  ".venv",                               # common env
  ".vscode",                             # common env
  ".zed",                                # common env
  ".mypy_cache",                         # tools
  ".pytest_cache",                       # tools
  ".ruff_cache",                         # tools
  "dist",                                # dist
  "docs",                                # docs
  "__pycache__",                         # cache
]
per-file-ignores = """
    pyinfra_webserver/deploy.py: WPS202
"""

[tool.mypy]
strict = true
strict_bytes = true
strict_equality = true
python_version = "3.13"
platform = "linux"
local_partial_types = true
warn_unreachable = true
exclude = [
  "^.git/",                 # common env
  "^.idea/",                # common env
  "^.venv/",                # common env
  "^.vscode/",              # common env
  "^.zed/",                 # common env
  "^.mypy_cache/",          # tools
  "^.pytest_cache/",        # tools
  "^.ruff_cache/",          # tools
  "^dist/",                 # dist
  "^docs/",                 # docs
]
disable_error_code = [
  "no-untyped-call",        # In example for https://github.com/grpc/grpc/pull/37877
  "no-untyped-def",         # In example for https://github.com/grpc/grpc/pull/37877
]

[tool.pydoctor]
add-package = ["pyinfra_webserver"]
docformat = "google"
html-output = "build/apidocs"
project-name = "pyinfra-webserver"
sidebar-expand-depth = 2
warnings-as-errors = true

[tool.pyright]
venv = ".venv"
venvPath = "."
pythonVersion = "3.13"
pythonPlatform = "Linux"
exclude = [
  ".*",                   # common env
  ".venv",                # common env
  "**/__pycache__",       # common env
  "**/node_modules",      # common env
]

[tool.ruff]
preview = true
fix = false
target-version = "py313"
line-length = 120
extend-exclude = [
  ".git",                 # common env
  ".idea",                # common env
  ".venv",                # common env
  ".vscode",              # common env
  ".zed",                 # common env
  ".mypy_cache",          # tools
  ".pytest_cache",        # tools
  ".ruff_cache",          # tools
  "dist",                 # dist
  "docs",                 # docs
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = []
ignore = [
  "ANN002",        # Missing type annotation for *{name}
  "ANN003",        # Missing type annotation for **{name}
]
extend-select = [
  "F",             # Pyflakes
  "E",             # pycodestyle - Error
  "W",             # pycodestyle - Warning
  "I",             # isort
  "UP",            # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101",         # Checks for uses of the assert keyword
]

[tool.ruff.lint.isort]
lines-after-imports = 2
lines-between-types = 0
known-first-party = ["pyinfra_webserver"]
known-third-party = ["pyinfra"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tombi]
files.exclude = ["uv.lock"]
format.rules.trailing-comment-alignment = true
